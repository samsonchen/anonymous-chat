# 把網站建置好，自動發布到 GitHub Pages。
# 一次性設定：repo 的 Settings → Pages → Build and deployment → Source 選「GitHub Actions」。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # 沒設定時用模擬版。要接 Supabase，到 repo 的 Settings → Secrets and variables → Actions → Variables
          # 設定這三個值（只放 Project URL 和 publishable key，絕對不要放 sb_secret_ 或 service_role）。
          VITE_CHAT_BACKEND: ${{ vars.VITE_CHAT_BACKEND || 'mock' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
